name: Fork release

# Publishes one GitHub release tagged v<upstream>+<custom>, building only the platforms that need it.
# Triggered by pushing a tag v<upstream>+<custom> (the tag is the version), or manually, in which case the version
# is composed from gradle.properties and fork/custom-version.txt on the dispatched commit.
#
# Tag push: Android and Windows are chosen from what changed since the previous release tag (shared code
# rebuilds both; androidApp/ only Android; desktopApp/ only Windows). Linux, macOS and iOS never build
# automatically. Manual dispatch builds exactly the platforms ticked. A release without a platform's asset
# simply lacks that file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android:
        description: Build the Android APK
        type: boolean
        default: true
      windows:
        description: Build the Windows zips and installer
        type: boolean
        default: true
      linux:
        description: Build the Linux AppImages
        type: boolean
        default: false
      macos:
        description: Build the macOS DMGs
        type: boolean
        default: false
      ios:
        description: Build the iOS IPA (unsigned; failures do not block the release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      android: ${{ steps.platforms.outputs.android }}
      windows: ${{ steps.platforms.outputs.windows }}
      linux: ${{ steps.platforms.outputs.linux }}
      macos: ${{ steps.platforms.outputs.macos }}
      ios: ${{ steps.platforms.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Choose platforms
        id: platforms
        env:
          EVENT: ${{ github.event_name }}
          IN_ANDROID: ${{ inputs.android }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_LINUX: ${{ inputs.linux }}
          IN_MACOS: ${{ inputs.macos }}
          IN_IOS: ${{ inputs.ios }}
        run: |
          set -euo pipefail
          android=false windows=false linux=false macos=false ios=false
          if [ "$EVENT" = workflow_dispatch ]; then
            android=$IN_ANDROID windows=$IN_WINDOWS linux=$IN_LINUX macos=$IN_MACOS ios=$IN_IOS
          else
            prev="$(git tag --list 'v*+*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -1 || true)"
            if [ -z "$prev" ]; then
              android=true windows=true
            else
              changed="$(git diff --name-only "$prev" HEAD)"
              echo "Changed since $prev:"; echo "$changed"
              common='^(shared/|listenTogetherProto/|metroproto/|opusDecoder/|gradle/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties)'
              if grep -qE "$common|^androidApp/" <<<"$changed"; then android=true; fi
              if grep -qE "$common|^(desktopApp/|metro-wv2-helper/)" <<<"$changed"; then windows=true; fi
            fi
          fi
          for p in android windows linux macos ios; do echo "$p=${!p}" >> "$GITHUB_OUTPUT"; done
          echo "Building: android=$android windows=$windows linux=$linux macos=$macos ios=$ios" >> "$GITHUB_STEP_SUMMARY"
      - name: Compose version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')"
          custom="$(tr -d '\r\n ' < fork/custom-version.txt)"
          [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected upstream version: $upstream" >&2; exit 1; }
          [[ "$custom" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected custom version: $custom" >&2; exit 1; }
          version="$upstream+$custom"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" == "$upstream+"* ]] || { echo "Tag $GITHUB_REF_NAME does not start with upstream version $upstream" >&2; exit 1; }
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; bump fork/custom-version.txt first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android
    if: needs.prepare.outputs.android == 'true'
    needs: prepare
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: read
    with:
      run-verification: false
      variant: release
      upload-artifact: true
      artifact-name: release-android
      require-signing: true
      # The collect step compares the APK's versionName with this, and gradle.properties only holds the upstream part.
      app-version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  windows:
    name: Windows
    if: needs.prepare.outputs.windows == 'true'
    needs: prepare
    uses: ./.github/workflows/reusable-desktop-windows.yml
    permissions:
      contents: read
    with:
      run-verification: false
      upload-artifact: true
      artifact-prefix: release-
    secrets: inherit

  windows-manager:
    name: Windows installer
    if: needs.prepare.outputs.windows == 'true'
    needs: [prepare, windows]
    uses: ./.github/workflows/reusable-windows-manager.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      run-verification: false

  linux:
    name: Linux
    if: needs.prepare.outputs.linux == 'true'
    needs: prepare
    uses: ./.github/workflows/reusable-desktop-linux.yml
    permissions:
      contents: read
    with:
      run-verification: false
      upload-artifact: true
      artifact-prefix: release-
    secrets: inherit

  macos:
    name: macOS
    if: needs.prepare.outputs.macos == 'true'
    needs: prepare
    uses: ./.github/workflows/reusable-desktop-macos.yml
    permissions:
      contents: read
    with:
      run-verification: false
      x64-use-intel-runner: true
      upload-artifact: true
      artifact-prefix: release-
    secrets: inherit

  ios:
    name: iOS
    if: needs.prepare.outputs.ios == 'true'
    needs: prepare
    uses: ./.github/workflows/reusable-ios-build.yml
    permissions:
      contents: read
    with:
      run-verification: false
      build-ipa: true
      upload-artifact: true
      artifact-name: release-ios
    secrets: inherit

  publish:
    name: Publish release
    needs: [prepare, android, windows, windows-manager, linux, macos, ios]
    # iOS is optional; every platform that was selected must have succeeded (a skipped one was not selected).
    if: >-
      always() && !cancelled()
      && contains(fromJSON('["success","skipped"]'), needs.android.result)
      && contains(fromJSON('["success","skipped"]'), needs.windows.result)
      && contains(fromJSON('["success","skipped"]'), needs.windows-manager.result)
      && contains(fromJSON('["success","skipped"]'), needs.linux.result)
      && contains(fromJSON('["success","skipped"]'), needs.macos.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Name and checksum assets
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID: ${{ needs.prepare.outputs.android }}
          WINDOWS: ${{ needs.prepare.outputs.windows }}
        run: |
          set -euo pipefail
          cd release-assets
          if [ "$WINDOWS" = true ]; then
            # The Windows installer downloads this exact name; the ARM64 zip carries the version like upstream's.
            mv Metrolist-Desktop-Windows.zip Metrolist-Desktop-windows.zip
            mv Metrolist-Desktop-Windows-arm64.zip "metrolist-desktop-windows-arm64-${APP_VERSION}.zip"
            test -f "metrolist-installer-windows-x64-${APP_VERSION}.exe"
          fi
          if [ "$ANDROID" = true ]; then test -f Metrolist.apk; fi
          ls -l
          sha256sum -- * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$APP_VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$APP_VERSION" \
            --generate-notes \
            --latest
