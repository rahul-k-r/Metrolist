name: Windows manager

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the installer
        required: true
        type: string
      portable-artifact:
        description: Portable ZIP used by manual installer verification
        default: release-desktop-windows
        type: string
      run-verification:
        description: Run installer tests against the packaged ZIP
        default: true
        type: boolean

jobs:
  build:
    name: Windows manager
    runs-on: windows-2025 # fork: GitHub-hosted runner instead of Blacksmith
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out Metrolist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out pinned MetrolistManager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MetrolistGroup/MetrolistManager
          ref: 18d2846bcc95847f08ea969d707222c1566d9f65
          path: manager-source
          persist-credentials: false

      - name: Download portable artifact
        if: inputs.run-verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.portable-artifact }}
          path: release-input

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: manager-source/go.mod
          cache-dependency-path: manager-source/go.sum

      - name: Teach the manager the fork's +MAJOR.MINOR.PATCH build part
        # The pinned manager only accepts MAJOR.MINOR.PATCH[-aN]. Fork versions are <upstream>+<custom>, so accept the
        # build part and order releases that share an upstream version by it. Each edit must match exactly once.
        shell: pwsh
        run: |
          $path = "manager-source/internal/version/version.go"
          $src = [IO.File]::ReadAllText($path)
          function Swap([string]$text, [string]$old, [string]$new) {
            if ($text.Split([string[]]@($old), [StringSplitOptions]::None).Count -ne 2) { throw "expected exactly one occurrence of: $old" }
            return $text.Replace($old, $new)
          }
          $src = Swap $src 'components [3]uint64' @'
          components [3]uint64
              build      [3]uint64
          '@
          $src = Swap $src 'core, suffix, prerelease := strings.Cut(value, "-")' @'
          value, buildPart, hasBuild := strings.Cut(value, "+")
              if hasBuild {
                  buildParts := strings.Split(buildPart, ".")
                  if len(buildParts) != len(result.build) {
                      return result, errors.New("expected +MAJOR.MINOR.PATCH build")
                  }
                  for index, part := range buildParts {
                      number, err := strconv.ParseUint(part, 10, 64)
                      if err != nil {
                          return result, errors.New("build component is not a non-negative integer")
                      }
                      result.build[index] = number
                  }
              }
              core, suffix, prerelease := strings.Cut(value, "-")
          '@
          $src = Swap $src 'return 0, nil' @'
          for index := range l.build {
                  if l.build[index] < r.build[index] {
                      return -1, nil
                  }
                  if l.build[index] > r.build[index] {
                      return 1, nil
                  }
              }
              return 0, nil
          '@
          [IO.File]::WriteAllText($path, $src)

      - name: Check the patched manager accepts the release version
        working-directory: manager-source
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          @"
          package version

          import "testing"

          func TestForkBuildPart(t *testing.T) {
              if err := Validate("$env:APP_VERSION"); err != nil {
                  t.Fatal(err)
              }
              order := []string{"14.0.0", "14.0.0+0.1.0", "14.0.0+0.1.9", "14.0.0+0.10.0", "14.0.1+0.1.0"}
              for i := 1; i < len(order); i++ {
                  if got, _ := Compare(order[i-1], order[i]); got != -1 {
                      t.Fatalf("%s should be older than %s", order[i-1], order[i])
                  }
              }
          }
          "@ | Set-Content -Path internal/version/fork_build_test.go -Encoding utf8
          go test ./internal/version/
          if ($LASTEXITCODE -ne 0) { throw "version tests failed" }

      - name: Generate release-bound manager config
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          $config = @"
          package buildconfig

          const (
              TargetVersion = "$env:APP_VERSION"
              ReleaseTag = "v$env:APP_VERSION"
              DesktopAssetName = "Metrolist-Desktop-windows.zip"
              RepositoryOwner = "rahul-k-r"
              RepositoryName = "Metrolist"
          )
          "@
          Set-Content -Path "manager-source/internal/buildconfig/config.go" -Value $config -Encoding utf8

      - name: Test manager
        if: inputs.run-verification
        working-directory: manager-source
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

      - name: Validate portable payload
        if: inputs.run-verification
        working-directory: manager-source
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: go run ./cmd/validate-payload "../release-input/Metrolist-Desktop-Windows.zip" "$env:APP_VERSION"

      - name: Embed Windows resources
        working-directory: manager-source
        shell: pwsh
        run: >-
          go run github.com/akavel/rsrc@v0.10.2
          -arch amd64
          -manifest MetrolistManager.exe.manifest
          -ico ../desktopApp/src/desktopMain/resources/logo.ico
          -o rsrc_windows_amd64.syso

      - name: Build manager
        working-directory: manager-source
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "dist/metrolist-installer-windows-x64-$env:APP_VERSION.exe" .

      - name: Install, repair and uninstall end to end
        if: inputs.run-verification
        working-directory: manager-source
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          $env:METROLIST_MANAGER_E2E_BINARY = (Resolve-Path "dist/metrolist-installer-windows-x64-$env:APP_VERSION.exe").Path
          $env:METROLIST_MANAGER_E2E_PAYLOAD = (Resolve-Path "../release-input/Metrolist-Desktop-Windows.zip").Path
          $env:METROLIST_MANAGER_E2E_VERSION = $env:APP_VERSION
          go test -run TestEndToEndInstallUpdateAndUninstall -count=1 -v .

      - name: Upload manager artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-manager
          path: manager-source/dist/metrolist-installer-windows-x64-${{ inputs.version }}.exe
          if-no-files-found: error
          retention-days: 4
